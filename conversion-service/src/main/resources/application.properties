spring.application.name=conversion-service

ffmpeg.path=/opt/homebrew/bin
convert.temp.path=/tmp/mediasense-temp
whisper.path=whisper
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
spring.mvc.async.request-timeout=1800000

# MinIO
minio.endpoint=http://localhost:9000
minio.access-key=admin
minio.secret-key=password123
buckets.input-bucket=audio-video-converter-files
buckets.output-bucket=audio-video-converter-converted-files

app.topic.conversion-jobs=conversion-jobs

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Kafka consumer settings
spring.kafka.consumer.group-id=conversion-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
